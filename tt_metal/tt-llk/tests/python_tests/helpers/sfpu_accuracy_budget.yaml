# ── Exact and predicate unary ops ───────────────────────────────────────────
#
# Fill, Threshold, the Is* predicates, LogicalNot, Signbit, UnaryEq/UnaryNe,
# ReluMax/ReluMin, Frac, Sign and Heaviside, each in its alphabetical place below.
#
# Measured on Wormhole 2026-09-18 over the standard unary sweep with --ulp-report.
# These ops are exactly rounded by construction -- a predicate writing 1.0/0.0, a
# constant fill, a clamp, or a subtraction the hardware does in one step -- so the budget
# is 0 and any drift at all is a regression. The exception is a 16-bit output from a
# wider input, where a selection or clamp that passes x through can measure 1 step: the
# op is still exact, and the step is the output rounding on the way out of Dest, as the
# rows there record, and every row there carries exactly that 1: the measured step is
# the gate.
#
# Every row names an output format that was actually measured. Nothing is enrolled on
# Bfp8_b: its shared block exponent quantises a small element in a wide block to zero,
# which costs thousands of steps for reasons that have nothing to do with the kernel
# (ReluMax reports 15488 there on the stimuli where ReluMin reports 3). An unlisted
# format falls through to the tolerance metric, which is what Bfp8_b and Bfp4_b want.

# ── Binary and ternary SFPU, and the remaining unary approximations ─────────
#
# GeluTanh, Tanhshrink, SqrtCustom and the Sfpu* ops other than SfpuElwpow and
# SfpuXlogy (which have their own note), each in its alphabetical place below.
#
# Measured on Wormhole 2026-09-18 with --ulp-report over each driver's own sweep. The
# `measured` figure each row records is the worst lane of that sweep, and it is the
# gate: the drivers seed their stimuli, so the figure is reproducible. A row is
# only written where it is *tighter* than the tolerance it replaces: the usable ceiling
# is 419430 steps on Float32, 51 on Float16 and 6 on Float16_b, and an op past it is
# recorded as tolerance with its measurement so nobody re-derives it.
#
# Bfp8_b is never enrolled here. Its shared block exponent quantises a small element in
# a wide block to zero, which costs ~15k steps on ops that cannot be wrong; that is the
# block, not the kernel. Unlisted formats fall through to the tolerance metric.

# ── Derived from the accuracy sweep ───────────────────────────────────────
#
# Two kinds of row. A row with `run` was written by `pytest test_unary_sfpu_ulp.py
# --ulp-emit` from that run's own measurements. A row with `sampled` was measured by a
# functional driver's sample; nothing regenerates it. Rows the emitter keeps verbatim --
# an op-wide `atol`/`rtol`, a field it cannot re-derive -- are hand-maintained, and say so.
# Every key pins `in` as well as `out`: what reaches the SFPU is already quantized by
# the unpack, and a Bfp8_b input carries 7 magnitude bits behind a shared block
