#
# The accuracy contract each SFPU op declares. Read by helpers/sfpu_accuracy_budget.py,
# which is the only thing that should parse it; see that module for what the fields mean
# and how a key is matched.
#
# One row per (op, variant). A row's key fields are `in`, `out`, `approx`, `dest` and
# `arch`; every one is optional, an omitted field matches any value, and the most
# specific matching row wins. Two rows that match the same variant equally
# specifically are an authoring error, not a tie-break, and the loader refuses them.
#
# Only Float16_b, Float16 and Float32 appear here, in or out: the SFPU computes in 16-
# and 32-bit floats, and a block float's error is the unpacker's and packer's, not the
# op's. The loader refuses a row that names one, and a variant with one keeps the op's
# declared tolerance.
#
# The contract is the row's `measured` figure, in steps (+ optional `near_zero_atol`),
# or `metric: tolerance` with optional `atol`/`rtol`. A ULP row without a figure is
# refused: the measurement is the gate, and there is no second number.
#
# `approx` and `dest` are quoted on purpose: YAML 1.1 reads a bare No/Yes as a boolean.
# The loader accepts both spellings, but quote them so the file says what it means.
#
# A row that carries a budget records the measurement it came from, as fields:
#
#   measured      the worst lane, in steps, over the lanes the row judges (outside the
#                 `near_zero_atol` floor, on a row that has one); on a ULP row, the gate
#   nonfinite     on a tolerance row, the lanes that disagreed with the golden about
#                 being finite; the headroom report fails a run where it grows
#
# A row the exhaustive sweep writes for a cell with a per-element ULP carries, instead
# of a figure and a metric, its `domains` list: one line that says how the op behaves
# over the whole swept range of that format combination (tests/SFPU_ULP.md, "Where an
# op holds its figure"):
#
#   domains: [{low: -.inf, high: -1, ulp: 3}, {low: -1, high: 1, ulp: 10}, {low: 1, high: .inf, ulp: 3}]
#
# An entry holds the lanes with low <= x < high, x as the kernel received it; `ulp` is
# the worst lane there (outside the near-zero floor, on a row that has one), or null
# where too few lanes are ranked to draw an edge on. An entry within the output's usable ceiling is gated at its
# figure; one past it is measured, not gated. The whole-cell contract is derived: gated
# at the largest figure when every entry is within the ceiling, tolerance otherwise.
#
# There is no headroom over a figure: the
# sweep holds a cell to exactly what was measured, a worse measurement is recorded by
# a re-emit, and the PR guard reads that as a raised gate, which lands in a change of
# its own -- the whole point of the table is that no number here is a guess, and the
# measurement itself is the number. The comment beside a row is prose for people (the
# floor a demotion tried, the lanes an unmeasurable cell named, a hand note); no code
# reads it.
#
# A `metric: tolerance` row with a `measured` figure and no `nonfinite` was demoted: the
# measurement is past `usable_budget_ceiling` (one inside it is enrolled, at its
# measurement). A `nonfinite` row is parked by those lanes whatever its `measured` says.
# Past the ceiling a step budget is no longer *tighter*
# than the tolerance it replaces, and since the ULP arm of `passed_test` returns before
# both isclose and PCC, such a budget would be the whole gate.
#
# Every cell the sweep drives that carries a step budget is gated -- a Float16_b or
# Float16 input, or a strided Float32 one, into a Float16_b/Float16/Float32 output; a
# tolerance cell is measured, not gated. The unary functional driver takes only the
# tolerance arm of a contract; the binary, ternary and scalar drivers gate on the whole
# of it (every output with a step row),
# because their rows were measured over their own sweeps, and so do the hand-built unary
# signbit, isinf/isnan and threshold sweeps (test_eltwise_unary_sfpu.py,
# `gate_on_step_budget`), whose stimuli measured those predicates' rows.
#
# On Wormhole and Blackhole no functional driver sweeps a Float16 input or output (the
# exponent-A format, not Float16_b), so nothing in CI gates the Float16 rows there: the
# binary ones (Elwadd/Elwsub/Elwrsub/Elwmul/Elwdiv, Eq..Ge, Max/Min, Fmod/Remainder) and
# the unary tolerance ones. They are the last measurement, and a stale one fails no test;
# re-measure before relying on one.
#
# Every exhaustive row was measured with FAST_MODE(No) and CLAMP_NEGATIVE(True) compiled
# in. The key has no axis for either, so a row holds for a kernel built that way: the
# unary functional driver builds Sqrt/Rsqrt at FastMode.Yes and Exp's clamp path depends
# on CLAMP_NEGATIVE, and it takes only a row's tolerance arm for those ops.
#
# ── Enrolled first: the ops exact by construction ──────────────────────────
#
# They are the flakiness canaries. A 0-step budget on Abs cannot be wrong about the
# kernel -- if one fails, the golden or the datapath moved. Re-measure on Blackhole
# before trusting any of it there.
#
# Relu is absent because it is packer-applied via STACC_RELU and is not a SfpuType
# member, so it will not compile through the unary driver. ReluMax/ReluMin take a
# threshold operand; they are enrolled with the exact and predicate ops below.
#
# Sign-bit and select: exact in fp32, one step in the 16-bit formats. No arithmetic to
# round, so fp32 is bit-exact. The single step on the 16-bit outputs is the *pack* path,
# not the op -- it shows up for Abs, Neg and Identity, mostly at dest_acc=Yes where it is
# rounded at pack rather than truncated in Dest first, and a step budget is what makes it
# visible at all (atol=0.05 is ~6 bf16 steps). These are exact by construction, so any
# movement is real signal. The narrowing Float16->Float16_b rows measure 1.
Abs:
  - {in: Float16, out: Float16, dest: "No", domains: [{low: -.inf, high: .inf, ulp: 0}]}
  - {in: Float16, out: Float16, dest: "Yes", domains: [{low: -.inf, high: .inf, ulp: 0}]}
  - {in: Float16, out: Float16_b, dest: "No", domains: [{low: -.inf, high: .inf, ulp: 1}]}
  - {in: Float16, out: Float16_b, dest: "Yes", domains: [{low: -.inf, high: .inf, ulp: 1}]}
  - {in: Float16, out: Float32, dest: "No", domains: [{low: -.inf, high: .inf, ulp: 0}]}
  - {in: Float16, out: Float32, dest: "Yes", domains: [{low: -.inf, high: .inf, ulp: 0}]}
  - {in: Float16_b, out: Float16, dest: "Yes", domains: [{low: -.inf, high: -65536, ulp: null}, {low: -65536, high: 65536, ulp: 0}, {low: 65536, high: .inf, ulp: null}]}
  - {in: Float16_b, out: Float16_b, dest: "No", domains: [{low: -.inf, high: .inf, ulp: 0}]}
  - {in: Float16_b, out: Float16_b, dest: "Yes", domains: [{low: -.inf, high: .inf, ulp: 0}]}
  - {in: Float16_b, out: Float32, dest: "No", domains: [{low: -.inf, high: .inf, ulp: 0}]}
  - {in: Float16_b, out: Float32, dest: "Yes", domains: [{low: -.inf, high: .inf, ulp: 0}]}
  - {in: Float32, out: Float16, dest: "No", domains: [{low: -.inf, high: -65536, ulp: null}, {low: -65536, high: -6.103515625e-05, ulp: 0}, {low: -6.103515625e-05, high: 6.103515625e-05, ulp: null}, {low: 6.103515625e-05, high: 65536, ulp: 0}, {low: 65536, high: .inf, ulp: null}]}
  - {in: Float32, out: Float16, dest: "Yes", domains: [{low: -.inf, high: -65536, ulp: null}, {low: -65536, high: 65536, ulp: 1}, {low: 65536, high: .inf, ulp: null}]}
  - {in: Float32, out: Float16_b, dest: "No", domains: [{low: -.inf, high: .inf, ulp: 0}]}
  - {in: Float32, out: Float16_b, dest: "Yes", domains: [{low: -.inf, high: .inf, ulp: 1}]}
  - {in: Float32, out: Float32, dest: "No", domains: [{low: -.inf, high: .inf, ulp: 0}]}
  - {in: Float32, out: Float32, dest: "Yes", domains: [{low: -.inf, high: .inf, ulp: 0}]}
  - {measured: 1}  # wh: max 1 ULP on Float16/Float16_b, 80 variants
  - {out: Float32, measured: 0}  # wh: max 0 ULP, 32 variants


