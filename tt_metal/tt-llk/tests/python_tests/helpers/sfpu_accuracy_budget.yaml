# add/sub/rsub are single IEEE operations: one step on bf16 and fp16, and the Float32 65536
# is the usual output-rounding figure. sub/rsub's fp16 cells read 140 steps when ranked
# unflushed -- a near-cancelling a - b lands in the subnormal band the golden keeps and the
# pack flushes -- and 1 ranked with that band flushed, as the gate ranks them.
SfpuElwadd:
  - {out: Float32, measured: 65536}  # max 65536 ULP, 30 variants / 831k lanes
  - {out: Float16_b, measured: 1}  # max 1 ULP, 32 variants / 840k lanes
  - {out: Float16, measured: 1}  # max 1 ULP, 26 variants / 676k lanes
  - {in: Float16, out: Float16, dest: "No", measured: 1}  # budget kept at the 1 the same measurement carried before
  - {in: Float16, out: Float16, dest: "Yes", measured: 1}  # budget kept at the 1 the same measurement carried before
  - {in: Float16, out: Float16_b, dest: "No", measured: 1}  # budget kept at the 1 the same measurement carried before
  - {in: Float16, out: Float16_b, dest: "Yes", measured: 1}  # budget kept at the 1 the same measurement carried before
  - {in: Float16, out: Float32, dest: "No", measured: 0}
  - {in: Float16, out: Float32, dest: "Yes", measured: 0}
  - {in: Float16_b, out: Float16, dest: "Yes", measured: 0}
  - {in: Float16_b, out: Float16_b, dest: "No", measured: 1}  # budget kept at the 1 the same measurement carried before
  - {in: Float16_b, out: Float16_b, dest: "Yes", measured: 1}  # budget kept at the 1 the same measurement carried before
  - {in: Float16_b, out: Float32, dest: "No", measured: 0}
  - {in: Float16_b, out: Float32, dest: "Yes", measured: 0}
  - {in: Float32, out: Float16, dest: "Yes", measured: 1}  # budget kept at the 1 the same measurement carried before
  - {in: Float32, out: Float16_b, dest: "Yes", measured: 0}
  - {in: Float32, out: Float32, dest: "Yes", measured: 0}

# Division is driven by two sweeps: the nightly test_eltwise_binary_sfpu_edges (its
# registered poles, on Float16_b and Float32), where it is exact on both float columns,
# and test_eltwise_binary_sfpu_div, whose own stimuli are what set these numbers. The
# budget has to cover the harder of the two -- an earlier pass enrolled the 0 the edge
# sweep supports, which the dedicated sweep then failed on hardware.
SfpuElwdiv:
  - {out: Float32, measured: 32768}  # max 32768 ULP on the div sweep (0 on the edge sweep), 14 variants
  - {out: Float16_b, measured: 1}  # max 1 ULP on the div sweep (0 on the edge sweep), 14 variants
  - {out: Float16, measured: 4}  # max 4 ULP on the div sweep, fp16-subnormals flushed (305 unflushed), 5 variants
  - {in: Float16, out: Float16, dest: "No", measured: 4}
  - {in: Float16, out: Float16, dest: "Yes", measured: 1}
  - {in: Float16, out: Float16_b, dest: "No", measured: 1}  # budget kept at the 1 the same measurement carried before
  - {in: Float16, out: Float16_b, dest: "Yes", measured: 1}  # budget kept at the 1 the same measurement carried before
  - {in: Float16, out: Float32, dest: "No", measured: 32768}
  - {in: Float16, out: Float32, dest: "Yes", measured: 1}
  - {in: Float16_b, out: Float16, dest: "Yes", measured: 4}
  - {in: Float16_b, out: Float16_b, dest: "No", measured: 0}
  - {in: Float16_b, out: Float16_b, dest: "Yes", measured: 0}
  - {in: Float16_b, out: Float32, dest: "No", measured: 0}
  - {in: Float16_b, out: Float32, dest: "Yes", measured: 1}
  - {in: Float32, out: Float16_b, dest: "Yes", measured: 0}
  - {in: Float32, out: Float32, dest: "Yes", measured: 1}

