# Sign and Heaviside gate at 0 steps on every input below, the strided Float32 one
# included: they are exact by construction, so the emitter keeps a strided 0 rather than
# flooring it (EXACT_BY_CONSTRUCTION_OPS). The in-tree WH kernels
# branch on `abs(v) == 0`, so -0.0 is answered as zero (fixed in #55306), and a
# recurrence is a regression, not specified behaviour. Their block-float inputs measure 0
# like Signbit's: the one -0.0 lane the golden's own block quantization turns non-zero is
# masked by `ulp_sweep._normal_input`. The op-wide tolerance row answers only what the sweep does
